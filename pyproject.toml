[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ausmammal-explorer"
version = "0.1.0"
description = "Data tooling for the AusMammal Explorer project"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "FIT3163 Group 15" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
data = [
  # galah-python's 0.13.x line (every release through 0.13.6, the latest as
  # of writing, checked directly) ships nested same-quote f-strings in its
  # own source (e.g. common_add_functions.py) that only parse on Python
  # 3.12+ (PEP 701). No currently published >=0.13 release avoids this, so
  # the fix is requiring 3.12+ (see requires-python above and CI's
  # actions/setup-python) rather than capping galah-python.
  "galah-python>=0.13",
  # pandas 2.x raises ValueError when a NaN-containing result from .str
  # accessor methods (e.g. .str.contains on a column with missing values)
  # is used to boolean-index a DataFrame; pandas 3.x treats it as
  # non-matching instead. Pinned to 3.x so that behaviour is relied upon.
  "pandas>=3,<4",
  "numpy>=2,<3",
  "rasterio>=1.3,<2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

