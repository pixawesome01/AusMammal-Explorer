[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ausmammal-explorer"
version = "0.1.0"
description = "Data tooling for the AusMammal Explorer project"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "FIT3163 Group 15" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
data = [
  "galah-python>=0.13,<1",
  "pandas>=2,<3",
  "numpy>=2,<3",
  "rasterio>=1.3,<2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

